train_path: /kaggle/input/playground-series-s6e10/train.csv
test_path: /kaggle/input/playground-series-s6e10/test.csv
id_col: id
target: satisfaction
positive: true  # 実データは True/False の bool 型(True が 44.4%)。True を 1 として扱う。bool/数値の target では run.py はこの値を使わない
metric: auc
n_splits: 5
seed: 42
features: [encode_class, encode_binary, top4]
model: lgbm
params:
  n_estimators: 500
  learning_rate: 0.05
  verbose: -1
note: 相関が強い順に4列(exp_003に Inflight entertainment を追加)。Class は Eco=1, Eco Plus=2, Business=3
